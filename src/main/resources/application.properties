spring.application.name=backend

# DB — 기본값은 compose-local.yaml 의 로컬 개발용 DB. 서버에선 환경변수로 넣는다
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/woowang}
spring.datasource.username=${DB_USERNAME:woowang}
spring.datasource.password=${DB_PASSWORD:woowang}

# 스키마는 Flyway(db/migration)만 바꾼다. JPA 는 맞는지 확인만
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_batch_fetch_size=100

# 예시 데이터 시드 — SEED_SAMPLE=true 일 때만. 공개 전엔 끈다(.env.example)
app.seed-sample=${SEED_SAMPLE:false}

# FE 주소(쉼표로 여러 개 — 예: https://app-<앱이름>.<도메인>). 쿠키가 실린 요청을 허용하니(CorsConfig) 우리 FE 주소만 정확히
# * 패턴도 되지만 https://*.vercel.app 처럼 넓게 열면 남의 Vercel 사이트까지 허용된다
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# AI 서버(ETC docs/contracts/ai-api.md). 서버에선 compose 서비스 이름으로 — 예: http://ai:8000
app.ai.base-url=${AI_BASE_URL:http://localhost:8000}
# 넘으면 끊고 작업을 실패(AI_TIMEOUT)로. AI 서버는 100초 안에 답하거나 LLM_TIMEOUT 을 준다
app.ai.timeout-seconds=${AI_TIMEOUT_SECONDS:120}
# 사용자가 화면에서 기다리는 동기 호출(홈 입력 가르기 등 — entrance-api.md). 넘으면 504 AI_TIMEOUT. Cloudflare 가 100초에서 끊기 전에
app.ai.sync-timeout-seconds=${AI_SYNC_TIMEOUT_SECONDS:60}

# 로그인(BE#10) — 서버 세션 쿠키. BE 를 다시 켜면 세션이 사라져 다시 로그인한다
server.servlet.session.timeout=7d
server.servlet.session.tracking-modes=cookie
server.servlet.session.cookie.max-age=7d
server.servlet.session.cookie.http-only=true
# FE · BE 가 같은 상위 도메인(app- · api-)이면 lax 로 충분하다(ADR-004). 서버(https)에선 SESSION_COOKIE_SECURE=true
server.servlet.session.cookie.same-site=${SESSION_COOKIE_SAME_SITE:lax}
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}

# 사용자별 하루(한국 날짜) 분석 횟수 — 자료 넣기 · 문항 넣기 · 다시 시도마다 1 (S-15, SPEC 미결정 6)
app.limit.daily-analyses=${DAILY_ANALYSIS_LIMIT:20}

# SAMPLE(test-account) 심사용 테스트 계정 — 비밀번호가 비어 있으면 만들지 않는다(TestAccountSeeder)
app.test-account.login-id=${TEST_ACCOUNT_LOGIN_ID:test}
app.test-account.password=${TEST_ACCOUNT_PASSWORD:}
app.test-account.daily-limit=${TEST_ACCOUNT_DAILY_LIMIT:200}

# MCP 연결 주소 앞부분(ETC docs/contracts/mcp-api.md) — 만든 주소는 이 뒤에 토큰을 붙인 것. 요청 호스트로 짐작하지 않는다(Tunnel 뒤)
app.mcp.base-url=${MCP_BASE_URL:http://localhost:8080/mcp/}
# 차곡이(AI 서버)가 부르는 내부망 MCP 주소 앞부분(mcp-api.md 「토큰 범위」). 서버에선 compose 서비스 이름
app.mcp.internal-base-url=${MCP_INTERNAL_BASE_URL:http://localhost:8080/mcp/}
# 외부 AI 쓰기 하루 상한(사용자당 · 한국 날짜, mcp-api.md 「update_experience」). LLM 을 안 불러 분석 한도와 따로 센다
app.mcp.daily-write-limit=${MCP_DAILY_WRITE_LIMIT:50}

# 차곡이 일(chagok-api.md) — 일 전체 제한 시간(초). AI 서버는 110초 안에 끝내거나 LLM_TIMEOUT 을 준다. 도구 호출 상한은 AI 에 넘긴다
app.chagok.timeout-seconds=${CHAGOK_TIMEOUT_SECONDS:120}
app.chagok.max-tool-calls=${CHAGOK_MAX_TOOL_CALLS:8}

# 자료 넣기 텍스트 한도(String.length()). AI 서버 한도(50000, ai-api.md)보다 크면 안 된다
app.source.max-text-length=50000

# 비어 있는 STAR(NONE) 를 BE 가 알아서 정리(BE#180 · ADR-019) — AI /star 를 분석 횟수 없이 부른다(유료 API).
# 켜질 때 정리할 활동이 max-backlog 를 넘으면 시작하지 않고 로그로 알린다 — PM 에게 묻고 올려서 다시 켠다
app.star.auto-sort.enabled=${STAR_AUTO_SORT_ENABLED:true}
app.star.auto-sort.max-backlog=${STAR_AUTO_SORT_MAX_BACKLOG:500}
