spring.application.name=backend

# DB — 기본값은 compose-local.yaml 의 로컬 개발용 DB. 서버에선 환경변수로 넣는다
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/woowang}
spring.datasource.username=${DB_USERNAME:woowang}
spring.datasource.password=${DB_PASSWORD:woowang}

# 스키마는 Flyway(db/migration)만 바꾼다. JPA 는 맞는지 확인만
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_batch_fetch_size=100

# 예시 데이터 시드 — SEED_SAMPLE=true 일 때만. 공개 전엔 끈다(.env.example)
app.seed-sample=${SEED_SAMPLE:false}

# FE 주소(쉼표로 여러 개, * 패턴 가능 — 예: https://<프로젝트>-*-<팀>.vercel.app)
# https://*.vercel.app 처럼 넓게 열면 남의 Vercel 사이트까지 허용된다 — 우리 프로젝트 · 팀 이름으로 좁힌다
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}
