# 로컬 개발용 DB 하나만 띄운다 — docker compose -f compose-local.yaml up -d
# 서버 배포용은 docker-compose.yml(BE · AI · DB · Tunnel).
# 아래 계정은 내 PC 에서만 쓰는 개발용 값이다. 서버 비밀번호는 .env 로.
services:
  db:
    image: pgvector/pgvector:pg18
    environment:
      POSTGRES_DB: woowang
      POSTGRES_USER: woowang
      POSTGRES_PASSWORD: woowang
    ports:
      - "127.0.0.1:5432:5432" # 내 PC 안에서만 연다(같은 네트워크의 다른 기기는 못 붙는다)
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U woowang -d woowang"]
      interval: 5s
      retries: 10

volumes:
  db-data:
